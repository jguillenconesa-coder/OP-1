name: Check native Windows packaging
on:
  push:
    branches: [main]
    paths: ['.github/workflows/windows-packaging-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nsis:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - run: choco install nsis --no-progress -y
      - name: Diagnose installed NSIS target support
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Command = Get-Command makensis.exe -ErrorAction SilentlyContinue
          $Nsis = if ($Command) { $Command.Source } else { "${env:ProgramFiles(x86)}/NSIS/makensis.exe" }
          "### NSIS packaging prerequisites" >> $env:GITHUB_STEP_SUMMARY
          "Compiler: $Nsis" >> $env:GITHUB_STEP_SUMMARY
          & $Nsis /VERSION >> $env:GITHUB_STEP_SUMMARY
          $Probe = Join-Path $env:RUNNER_TEMP 'target-check.nsi'
          @'
          Unicode True
          Target amd64-unicode
          Name "NSIS target check"
          OutFile "target-check.exe"
          Section
          SectionEnd
          '@ | Set-Content $Probe
          & $Nsis /V4 $Probe 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/nsis-check.log"
          $Code = $LASTEXITCODE
          '```text' >> $env:GITHUB_STEP_SUMMARY
          Get-Content "$env:RUNNER_TEMP/nsis-check.log" -Tail 50 >> $env:GITHUB_STEP_SUMMARY
          '```' >> $env:GITHUB_STEP_SUMMARY
          if ($Code -ne 0) { throw "NSIS target check failed: $Code" }
