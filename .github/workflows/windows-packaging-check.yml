name: Check native Windows packaging
on:
  push:
    branches: [main]
    paths: ['.github/workflows/windows-packaging-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nsis:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - run: choco install nsis --no-progress -y
      - name: Diagnose installed NSIS target support
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Command = Get-Command makensis.exe -ErrorAction SilentlyContinue
          $Nsis = if ($Command) { $Command.Source } else { "${env:ProgramFiles(x86)}/NSIS/makensis.exe" }
          "### NSIS packaging prerequisites" >> $env:GITHUB_STEP_SUMMARY
          "Compiler: $Nsis" >> $env:GITHUB_STEP_SUMMARY
          & $Nsis /VERSION >> $env:GITHUB_STEP_SUMMARY
          $Probe = Join-Path $env:RUNNER_TEMP 'target-check.nsi'
          @'
          Unicode True
          Target amd64-unicode
          Name "NSIS target check"
          OutFile "target-check.exe"
          Section
          SectionEnd
          '@ | Set-Content $Probe
          $Stdout = Join-Path $env:RUNNER_TEMP 'nsis-target.stdout.txt'
          $Stderr = Join-Path $env:RUNNER_TEMP 'nsis-target.stderr.txt'
          $Process = Start-Process -FilePath $Nsis -ArgumentList @('/V4', "`"$Probe`"") -Wait -PassThru -RedirectStandardOutput $Stdout -RedirectStandardError $Stderr
          $Code = $Process.ExitCode
          $Details = ((Get-Content $Stdout -Tail 25) + (Get-Content $Stderr -Tail 25)) -join "`n"
          Write-Output $Details
          $Encoded = $Details.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
          if ($Code -ne 0) {
            Write-Host "::error title=Native NSIS target check::$Encoded"
            throw "NSIS target check failed: $Code"
          }
          Write-Host "::notice title=Native NSIS target check::$Encoded"
