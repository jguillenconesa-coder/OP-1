name: Build, test and package
permissions:
  contents: read
on:
  push:
    paths:
      - 'Source/**'
      - 'Assets/**'
      - 'Tests/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'packaging/**'
      - '.github/workflows/build.yml'
  pull_request:
  workflow_dispatch:
jobs:
  build:
    # Keep required check names stable when pinning the underlying runner image.
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022, macos-latest]
        include:
          # ARM64, like macos-latest; avoid the moving latest image during queues.
          - os: macos-latest
            runner: macos-15
    runs-on: ${{ matrix.runner || matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxext-dev libxinerama-dev libxrandr-dev libxcursor-dev libxrender-dev libxfixes-dev libfreetype-dev libfontconfig-dev libgl-dev xvfb
      - name: Configure Windows x64
        if: runner.os == 'Windows'
        run: cmake -S . -B build -A x64
      - name: Configure Linux and macOS
        if: runner.os != 'Windows'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release --parallel 2
      - name: Linux tests
        if: runner.os == 'Linux'
        run: xvfb-run -a ctest --test-dir build -C Release --output-on-failure
      - name: Windows and macOS tests
        if: runner.os != 'Linux'
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Publish CTest failure details
        if: failure()
        shell: bash
        run: |
          python - <<'PYTESTLOG'
          from pathlib import Path
          import os
          path = Path('build/Testing/Temporary/LastTest.log')
          if path.exists():
              text = path.read_text(errors='replace')[-60000:]
              summary = os.environ.get('GITHUB_STEP_SUMMARY')
              if summary:
                  with open(summary, 'a', encoding='utf-8') as output:
                      output.write('### CTest diagnostics\n\n```text\n' + text + '\n```\n')
              sections = text.split('----------------------------------------------------------')
              for index, section in enumerate(sections):
                  if 'Test Failed.' in section:
                      output = sections[index-1] if index else ''
                      message = (output + section)[-10000:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                      print('::error title=CTest failure::' + message)
          PYTESTLOG
      - name: Test Windows standalone startup
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/windows/test-startup.ps1 -BuildDir build
      - name: Install NSIS
        if: runner.os == 'Windows'
        run: choco install nsis --no-progress -y
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/windows/build-installer.ps1 -BuildDir build
      - name: Test Windows install and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/windows/test-installer.ps1 -BuildDir build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Pocket-One-${{ runner.os }}
          path: |
            build/PocketOne_artefacts/Release/VST3/
            build/PocketOne_artefacts/Release/Standalone/
            dist/*-Setup.exe
            build/realtime-metrics.json
