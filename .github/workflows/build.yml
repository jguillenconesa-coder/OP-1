name: Build, test and package
permissions:
  contents: read
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxext-dev libxinerama-dev libxrandr-dev libxcursor-dev libxrender-dev libxfixes-dev libfreetype-dev libfontconfig-dev libgl-dev xvfb
      - name: Configure Windows x64
        if: runner.os == 'Windows'
        run: cmake -S . -B build -A x64
      - name: Configure Linux and macOS
        if: runner.os != 'Windows'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release --parallel 2
      - name: Linux tests
        if: runner.os == 'Linux'
        run: xvfb-run -a ctest --test-dir build -C Release --output-on-failure
      - name: Windows and macOS tests
        if: runner.os != 'Linux'
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Install NSIS
        if: runner.os == 'Windows'
        run: choco install nsis --no-progress -y
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/windows/build-installer.ps1 -BuildDir build
      - name: Test Windows install and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/windows/test-installer.ps1 -BuildDir build
      - uses: actions/upload-artifact@v4
        with:
          name: Pocket-One-${{ runner.os }}
          path: |
            build/PocketOne_artefacts/Release/VST3/
            build/PocketOne_artefacts/Release/Standalone/
            dist/*-Setup.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify versioned release assets
        working-directory: downloads/v0.2.0
        run: sha256sum --check SHA256SUMS.txt
      - name: Publish preview release and assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" downloads/v0.2.0/* \
            --verify-tag --title "Pocket One $RELEASE_TAG" \
            --notes-file docs/releases/v0.2.0.md --prerelease
