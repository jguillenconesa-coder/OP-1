name: Publish versioned downloads
on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['.github/workflows/release.yml']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag with downloads/<tag> assets
        required: true
        default: v0.2.1
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'v0.2.1' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Verify versioned assets
        run: |
          cd "downloads/$RELEASE_TAG"
          sha256sum --check SHA256SUMS.txt
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$RELEASE_TAG" --json tagName >/dev/null 2>&1; then
            echo "Release already exists; leaving its published assets unchanged."
          else
            gh release create "$RELEASE_TAG" "downloads/$RELEASE_TAG/"* \
              --verify-tag --title "Pocket One $RELEASE_TAG" \
              --notes-file "docs/releases/$RELEASE_TAG.md" --prerelease
          fi
